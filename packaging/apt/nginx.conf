# Serve the reprepro repo. apt fetches specific files, so directory listing is
# off, and reprepro's private bits (conf/, db/) are not exposed. The signing
# key's GNUPGHOME is a separate volume (not under the web root), so it is never
# reachable here.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;

    # reprepro internals — never serve these.
    location ~ ^/(conf|db)(/|$) {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
