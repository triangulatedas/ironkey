# Serve the reprepro repo. apt fetches specific files, so directory listing is
# off, and reprepro's private bits (conf/, db/) are not exposed. The signing
# key's GNUPGHOME is a separate volume (not under the web root), so it is never
# reachable here.
#
# IMPORTANT behind a CDN (Cloudflare): the repo METADATA under dists/ (InRelease,
# Release, Packages, Packages.gz) is rewritten on every publish, and apt verifies
# it by exact size/hash. A cached-but-stale index gives "File has unexpected
# size". So mark dists/ no-store here, AND set a Cloudflare Cache Rule to Bypass
# cache for this hostname (origin headers alone are not always honoured by the
# CDN). The pool/ .debs are version-named and immutable, so they may be cached.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;

    # reprepro internals — never serve these.
    location ~ ^/(conf|db)(/|$) {
        return 404;
    }

    # Repo indices: never cache (they change every publish).
    location /dists/ {
        add_header Cache-Control "no-store, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    # The signing key and packages are safe to cache.
    location /pool/ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
