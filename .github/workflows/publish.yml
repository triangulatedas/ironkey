name: Publish

# Build the .deb packages for amd64 and arm64 and, on a version tag, attach them
# to a GitHub Release. Trigger: push a tag like v0.1.0, or run manually
# (workflow_dispatch) for build-only artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create/upload the Release

jobs:
  build:
    name: deb (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }  # native arm64 runner
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the version's git commit count is right

      - name: Install build + packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libssl-dev libudev-dev libsystemd-dev libgtk-3-dev dpkg-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package (.deb)
        run: cd build && cpack -G DEB

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: build/*.deb

  release:
    name: Collect and release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all .deb artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: debs
      - name: Checksums
        run: cd debs && sha256sum *.deb | tee SHA256SUMS
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            debs/*.deb
            debs/SHA256SUMS
