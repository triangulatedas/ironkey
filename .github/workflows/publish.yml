name: Publish

# Build the .deb packages and, on a version tag, attach them to a GitHub Release.
# Trigger: push a tag like v0.1.0, or run manually (workflow_dispatch) for a
# build-only artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create/upload the Release

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the version's git commit count is right

      - name: Install build + packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libssl-dev libudev-dev libsystemd-dev libgtk-3-dev dpkg-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package (.deb)
        run: cd build && cpack -G DEB

      - name: Checksums
        run: cd build && sha256sum *.deb | tee SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debs
          path: |
            build/*.deb
            build/SHA256SUMS

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.deb
            build/SHA256SUMS
